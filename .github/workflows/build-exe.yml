name: Build exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: exe-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    name: Package CodexMonitor.exe
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build single executable
        run: npm run build:exe

      - name: Name artifact by version
        id: name
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if ($env:REF_TYPE -eq 'tag') {
            $version = $env:REF_NAME
          } else {
            $version = 'dev-' + $env:SHA.Substring(0, 7)
          }
          $target = "dist-exe/CodexMonitor-$version.exe"
          Move-Item -Force dist-exe/CodexMonitor.exe $target
          "artifact=CodexMonitor-$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: dist-exe/*.exe
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist-exe/*.exe
          generate_release_notes: true
